name: Get KittiSU Manager

permissions:
  actions: read

on:
  workflow_call:
    inputs:
      kittisu_branch:
        required: false
        type: string
        default: main
    outputs:
      susVer:
        description: SUSFS module version
        value: ${{ jobs.get_manager.outputs.susVer }}
      ksuVer:
        description: KittiSU version
        value: ${{ jobs.get_manager.outputs.ksuVer }}

jobs:
  get_manager:
    runs-on: ubuntu-latest
    outputs:
      ksuVer: ${{ steps.version.outputs.kversion }}
      susVer: ${{ steps.version.outputs.sversion }}
    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y git curl jq unzip zip

      - name: Validate KittiSU branch and calculate versions
        id: version
        run: |
          BRANCH="${{ inputs.kittisu_branch }}"
          if [ -z "$BRANCH" ] || ! git ls-remote --exit-code --heads https://github.com/terebiko/KittiSU.git "$BRANCH" >/dev/null; then
            echo "::error::KittiSU branch '$BRANCH' does not exist in terebiko/KittiSU." >&2
            exit 1
          fi
          git clone --branch "$BRANCH" https://github.com/terebiko/KittiSU.git KittiSU
          CONFIG_FILE="$GITHUB_WORKSPACE/config/config"
          if [ -f "$CONFIG_FILE" ] && [ "$(grep '^custom=' "$CONFIG_FILE" | cut -d= -f2-)" = true ]; then
            PIN=$(grep '^kittisu=' "$CONFIG_FILE" | cut -d= -f2-)
            if [ -n "$PIN" ]; then
              git -C KittiSU fetch origin "$PIN" || { echo "::error::Invalid KittiSU commit pin: $PIN"; exit 1; }
              git -C KittiSU checkout --detach "$PIN"
            fi
          fi
          COUNT=$(git -C KittiSU rev-list --count HEAD)
          KSU_VERSION=$((30700 + COUNT))
          SUS_VERSION=$(curl -fsSL 'https://gitlab.com/simonpunk/susfs4ksu/-/raw/gki-android14-6.1/ksu_module_susfs/module.prop?ref_type=heads' | awk -F= '$1 == "version" { print $2 }')
          echo "KSU_VERSION=$KSU_VERSION" >> "$GITHUB_ENV"
          echo "KITTISU_BRANCH=$BRANCH" >> "$GITHUB_ENV"
          echo "kversion=$KSU_VERSION" >> "$GITHUB_OUTPUT"
          echo "sversion=$SUS_VERSION" >> "$GITHUB_OUTPUT"

      - name: Download compatible KittiSU Manager artifact
        id: add_manager
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BEST_VERSION=0
          BEST_RUN=""
          BEST_ARTIFACTS=""
          for PAGE in $(seq 1 10); do
            RUNS=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/terebiko/KittiSU/actions/workflows/build-manager.yml/runs?branch=$KITTISU_BRANCH&status=success&per_page=30&page=$PAGE")
            COUNT=$(printf '%s' "$RUNS" | jq '.workflow_runs | length')
            [ "$COUNT" -eq 0 ] && break
            for INDEX in $(seq 0 $((COUNT - 1))); do
              RUN_ID=$(printf '%s' "$RUNS" | jq -r ".workflow_runs[$INDEX].id")
              SHA=$(printf '%s' "$RUNS" | jq -r ".workflow_runs[$INDEX].head_sha")
              git -C KittiSU fetch origin "$SHA" >/dev/null 2>&1 || continue
              VERSION=$((30700 + $(git -C KittiSU rev-list --count "$SHA")))
              [ "$VERSION" -gt "$KSU_VERSION" ] && continue
              ARTIFACTS=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/terebiko/KittiSU/actions/runs/$RUN_ID/artifacts")
              MATCHES=$(printf '%s' "$ARTIFACTS" | jq -r '.artifacts[] | select(.name == "Manager-gradle-release" or .name == "Spoofed-Manager-gradle-release") | "\(.name)\t\(.archive_download_url)"')
              [ -z "$MATCHES" ] && continue
              if [ "$VERSION" -gt "$BEST_VERSION" ]; then
                BEST_VERSION=$VERSION; BEST_RUN=$RUN_ID; BEST_ARTIFACTS=$MATCHES
              fi
            done
          done
          [ -n "$BEST_ARTIFACTS" ] || { echo "::error::No compatible KittiSU Manager artifact found for branch $KITTISU_BRANCH."; exit 1; }
          echo "Using KittiSU Manager run $BEST_RUN (version $BEST_VERSION)."
          while IFS=$'\t' read -r NAME URL; do
            SAFE_NAME=$(echo "$NAME" | tr '/ ' '__')
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -o "$SAFE_NAME.zip" "$URL"
            mkdir -p "manager-artifacts/$SAFE_NAME"
            unzip -oq "$SAFE_NAME.zip" -d "manager-artifacts/$SAFE_NAME"
          done <<< "$BEST_ARTIFACTS"

      - name: Download SUSFS module
        id: add_susfs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" 'https://api.github.com/repos/sidex15/susfs4ksu-module/actions/workflows/build.yml/runs?status=success&per_page=1' | jq -r '.workflow_runs[0].id')
          ARTIFACT=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/sidex15/susfs4ksu-module/actions/runs/$RUN_ID/artifacts" | jq -r '.artifacts[0] | "\(.name)\t\(.archive_download_url)"')
          IFS=$'\t' read -r NAME URL <<< "$ARTIFACT"
          echo "SUSFS_NAME=$NAME" >> "$GITHUB_ENV"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -o susfs-artifact.zip "$URL"
          mkdir susfs-module susfs-temp
          unzip -oq susfs-artifact.zip -d susfs-temp
          if find susfs-temp -name '*.zip' -print -quit | grep -q .; then find susfs-temp -name '*.zip' -exec cp {} susfs-module/ \; ; else (cd susfs-temp && zip -qr ../susfs-module/ksu_module_susfs.zip .); fi

      - name: Upload KittiSU Manager
        uses: actions/upload-artifact@v6
        with:
          name: KittiSU-Manager(${{ env.KSU_VERSION }})
          path: manager-artifacts/**/*.apk

      - name: Upload SUSFS module
        uses: actions/upload-artifact@v6
        with:
          name: susfs-${{ env.SUSFS_NAME }}
          path: susfs-module/*
