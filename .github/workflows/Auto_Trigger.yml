name: Track KittiSU Main Updates

permissions:
  contents: write

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  check-and-record:
    runs-on: ubuntu-24.04
    if: contains(fromJSON('["zzh20188", "elysias123", "terebiko"]'), github.repository_owner)
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Get KittiSU main commit
        id: current
        run: |
          SHA=$(git ls-remote https://github.com/terebiko/KittiSU.git refs/heads/main | awk '{print $1}')
          test -n "$SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - name: Record default-branch update
        run: |
          if git ls-remote --heads origin sha | grep -q sha; then
            git fetch origin sha:sha
            git checkout sha
          else
            git checkout --orphan sha
            git rm -rf . || true
          fi
          echo "${{ steps.current.outputs.sha }}" > latest_sha.txt
          git config user.email action@github.com
          git config user.name 'GitHub Action'
          git add latest_sha.txt
          git commit -m "Track KittiSU main at ${{ steps.current.outputs.sha }}" || exit 0
          git push origin sha
          echo "KittiSU main is tracked here only; manual builds may select any existing KittiSU branch."
