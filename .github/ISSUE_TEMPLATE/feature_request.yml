name: "Feature Request"
description: "Suggest a feature"
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        **Please describe your request.**

  - type: textarea
    id: feature
    attributes:
      label: "Feature Description"
      description: "Describe the feature you want."
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: "Use Case"
      description: "Why do you need this feature."

  - type: textarea
    id: additional
    attributes:
      label: "Additional Info"
      description: "Any other context, links, or screenshots."
