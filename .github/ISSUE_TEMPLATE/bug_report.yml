name: "Bug Report"
description: "Report a bug"
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        **Please fill in the following information.**

  - type: textarea
    id: description
    attributes:
      label: "Bug Description"
      description: "Describe the bug clearly."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: "Steps to Reproduce"
      description: "How to reproduce this issue."
      placeholder: |
        1. ...
        2. ...
        3. ...

  - type: textarea
    id: device
    attributes:
      label: "Device Info"
      description: "Your device and kernel information."
      value: |
        - Device:
        - Android Version:
        - Kernel Version:
        - KittiSU Version:
        - SUSFS Version:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "Logs"
      description: "Relevant logs or screenshots."
      render: shell
